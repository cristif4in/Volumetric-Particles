name: Build vp-cristi

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_SDK_VERSION: master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      # plugin-sdk (same dependency RedtimesUI / The-Definitive-UI uses)
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: ${{ env.PLUGIN_SDK_VERSION }}
          path: plugin-sdk

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # plugin-sdk master ships no premake option --pluginsdkdir: the SDK
      # directory is taken from the PLUGIN_SDK_DIR env var, and the solution
      # is generated via tools\generate\Visual Studio.bat. This produces
      # plugin.slnx whose plugin_sa project builds Plugin.lib into
      # $(PLUGIN_SDK_DIR)\output\lib.
      - name: Generate plugin-sdk solution (premake)
        working-directory: plugin-sdk
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=${{ github.workspace }}\plugin-sdk
          "tools\generate\Visual Studio.bat"

      - name: Build plugin-sdk (plugin_sa Release)
        working-directory: plugin-sdk
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
        shell: cmd
        run: msbuild plugin.slnx /p:Configuration=Release /p:Platform="Mixed Platforms" /m /t:plugin_sa

      - name: Build vp-cristi (Release Win32)
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
        shell: cmd
        run: |
          msbuild Volumetric-Particles.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /flp1:logfile=build.log;errorsonly > msb.txt 2>&1
          set EXITCODE=%ERRORLEVEL%
          if not exist build.log echo ::error build.log was not created - dumping console instead
          if exist build.log powershell -NoProfile -Command "foreach ($l in Get-Content build.log) { Write-Host ('::error ' + $l) }"
          powershell -NoProfile -Command "foreach ($l in Get-Content msb.txt) { if ($l -match ': error|LNK[0-9]|MSB[0-9]|C1[0-9]{3}') { Write-Host ('::error ' + $l) } }"
          exit /b %EXITCODE%

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item plugin-sdk\output\Volumetric-Particles\Release\vp-cristi.dll dist\vp-cristi.asi
          Copy-Item plugin-sdk\output\Volumetric-Particles\Release\vp-cristi.dll dist\vp-cristi.dll
          Copy-Item vp-cristi.ini dist\vp-cristi.ini
          Get-ChildItem dist

      # the dll and the asi are the SAME binary - SA loads .asi, some
      # launchers (and people who rename) prefer .dll, so we ship both
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp-cristi
          path: dist/

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
